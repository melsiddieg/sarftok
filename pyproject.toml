[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sarftok"
version = "0.1.0"
description = "Hybrid Probabilistic SarfTok tokenizer for Arabic LLM pretraining"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "SarfTok Contributors" },
]
keywords = ["arabic", "nlp", "tokenizer", "morphology", "llm", "pretraining"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
  "Natural Language :: Arabic",
]

dependencies = [
  "torch>=2.0",
  "sentencepiece>=0.1.99",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
camel = [
  "camel-tools>=1.5",
]
hf = [
  "transformers>=4.38",
  "datasets>=2.18",
  "tokenizers>=0.15",
]
train = [
  "accelerate>=0.27",
  "deepspeed>=0.13; sys_platform != 'darwin'",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.0",
  "black>=24.0",
  "ruff>=0.3",
  "mypy>=1.8",
  "sarftok[hf]",
]
all = [
  "sarftok[camel,hf,train,dev]",
]

[project.scripts]
sarftok-build-surface = "sarftok.scripts.build_surface_tokenizer:main"
sarftok-build-vocab   = "sarftok.scripts.build_morph_vocab:main"
sarftok-preprocess    = "sarftok.scripts.preprocess_corpus:main"
sarftok-inspect       = "sarftok.scripts.inspect_ambiguity:main"
sarftok-export-hf     = "sarftok.scripts.export_hf_assets:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sarftok*"]

[tool.pytest.ini_options]
testpaths = ["sarftok/tests", "sarftok/llm_integration/tests"]
addopts = "-v --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
